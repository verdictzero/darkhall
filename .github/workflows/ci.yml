# Runs the core and app tests and Android lint on every push and pull request, against the
# CC0 sample raws in tools/ci/samples.tsv (downloaded once, then cached) with LibRaw
# references written by rawpy. GPU parity runs on Mesa's software OpenGL ES.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mesa OpenGL ES (for the GPU parity tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri

      - name: Python for the LibRaw references
        run: pip install --quiet rawpy numpy

      - uses: actions/cache@v4
        with:
          path: samples
          key: samples-${{ hashFiles('tools/ci/samples.tsv') }}

      - name: Sample raws
        run: tools/ci/fetch_samples.sh samples

      - name: Tests and lint
        run: |
          ./gradlew --no-daemon --continue \
            :core:test :app:testDebugUnitTest :app:lintDebug \
            -Pdarkhall.sample="$PWD/samples/tg6.orf" \
            -Pdarkhall.sampleRef="$PWD/samples/tg6_raw_u16le.bin" \
            -Pdarkhall.rawsDir="$PWD/samples/raws" \
            -Pdarkhall.otherSample="$PWD/samples/raws/Pixel_6_Pro__PXL_20220910_093206982.dng" \
            -Pdarkhall.outDir="$RUNNER_TEMP/out"

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            ${{ runner.temp }}/out/screen_*.png
          if-no-files-found: ignore
