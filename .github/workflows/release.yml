# Builds the release APK and publishes it as a GitHub release, tagged v<versionName>, when
#  - a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0), or
#  - a branch push brings .github/release-notes/v<versionName>.md for a version that has no
#    release yet (the workflow then creates the tag on the pushed commit).
# Release notes come from .github/release-notes/<tag>.md when that file exists.
#
# Signing: add the repository secrets DARKHALL_KEYSTORE_BASE64 (base64 of a .jks),
# DARKHALL_KEYSTORE_PASSWORD, DARKHALL_KEY_ALIAS and DARKHALL_KEY_PASSWORD to sign with a
# permanent key. Without them the APK is signed with the runner's throwaway debug key, which
# installs fine but cannot be updated in place by the next release.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - ".github/release-notes/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
              exit 1
            fi
          elif [ ! -f ".github/release-notes/$tag.md" ]; then
            echo "No release notes for $tag; nothing to release."; tag=""
          elif gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released."; tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Signing key
        if: steps.tag.outputs.tag != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.DARKHALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DARKHALL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::no signing secrets; the APK is signed with a throwaway debug key"
          fi

      - name: Build
        if: steps.tag.outputs.tag != ''
        env:
          DARKHALL_KEYSTORE_PASSWORD: ${{ secrets.DARKHALL_KEYSTORE_PASSWORD }}
          DARKHALL_KEY_ALIAS: ${{ secrets.DARKHALL_KEY_ALIAS }}
          DARKHALL_KEY_PASSWORD: ${{ secrets.DARKHALL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Publish
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          apk="darkhall-$tag.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes=".github/release-notes/$tag.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          case "$tag" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$tag" "$apk" --title "Darkhall ${tag#v}" --target "$GITHUB_SHA" "$@"
